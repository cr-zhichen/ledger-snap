# ledger-snap 配置。密钥不写在这里：*_env 字段填的是存放密钥的环境变量名。

[server]
listen = ":8080"
data_dir = "data"
# 环境变量里写逗号分隔的邀请码，例如 "abc123,def456"
invite_codes_env = "LEDGER_SNAP_INVITE_CODES"
max_upload_mb = 10
image_retention_days = 30

[qianji]
base_url = "https://api.qianjiapp.com"
timeout = "20s"
# 签名用到 version_code，必须和 version_name 对应；改动前先跑 qianji-smoke
version_code = 1207
version_name = "4.5.1b3"
market = "beta"
os_version = "36"
device_brand = "LedgerSnap"
device_name = "LedgerSnap"
# 分类、资产目录超过这个时长就重新拉取；识别时没认出账户或分类，也会提前拉取一次
catalog_ttl = "6h"
# 修改已记的账之前，先从钱迹同步账单，免得覆盖在 App 里做的改动；最多等这么久，超时就不改
sync_wait = "5s"

[extraction]
# 图片提取模型的 OpenRouter ID
model = "qwen/qwen3.8-27b"
# 指定推理服务商；空字符串由 OpenRouter 选择，切换模型时一并调整
provider = "cerebras"
# true 将输出格式放进提示词；false 使用模型的结构化输出接口
schema_in_prompt = true
# 推理强度，需使用所选模型支持的值
reasoning_effort = "none"
# 最大输出 token 数
max_tokens = 8000
# 图片最长边、最短边像素及 JPEG 质量（1–100）
image_max_side = 1568
image_min_side = 280
jpeg_quality = 85

[openrouter]
base_url = "https://openrouter.ai"
api_key_env = "OPENROUTER_API_KEY"
timeout = "45s"
app_name = "ledger-snap"

[decision]
# openrouter：经 OpenRouter 决策接口调用，模型例如 typesafe/jev-1.14、openai/gpt-6-luna-decisions
# typesafe：直接调用 TypeSafe 官方接口（见 [typesafe]），模型为 jev-latest 或 jev-preview
provider = "openrouter"
model = "typesafe/jev-1.14"
[decision.thresholds]
category = 0.4
asset = 0.4

[typesafe]
base_url = "https://api.typesafe.ai"
api_key_env = "TYPESAFE_AI_API_KEY"
timeout = "30s"
# 官方接口只返回 token 数，按这个单价（美元/百万输入 token）估算费用
input_price_per_mtok = 0.042

[recognize]
timezone = "Asia/Shanghai"
# 这个时间窗口内同金额、同资产的账单视为疑似重复
dedup_window = "5m"
# 截图时间比手机时间早这么多，就把时间标为拿不准
stale_screenshot = "24h"
# 有拿不准的字段时先不记账，返回 needs_confirm 让用户确认或修改，确认后再写入
confirm_uncertain = true
