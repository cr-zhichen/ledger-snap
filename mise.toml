[tools]
go = "1.27.2"
actionlint = "1.7.12"

[tasks.build]
description = "构建 bin/ledger-snap"
run = "go build -o bin/ledger-snap ./cmd/ledger-snap"

[tasks.test]
description = "运行单元测试"
run = "go test ./..."

[tasks."workflows:lint"]
description = "校验 GitHub Actions 工作流"
run = "actionlint"

[tasks.check]
description = "格式检查、静态检查、工作流校验、测试与构建"
depends = ["workflows:lint"]
run = [
  "test -z \"$(gofmt -l cmd internal)\" || (gofmt -l cmd internal; exit 1)",
  "go vet ./...",
  "go test ./...",
  "go build -o bin/ledger-snap ./cmd/ledger-snap",
]

[tasks.serve]
description = "用 Harmonia 里的密钥在本机启动服务"
depends = ["build"]
run = "harmonia exec -- ./bin/ledger-snap serve"

[tasks.smoke]
description = "用 .env.local 里的测试账号跑钱迹冒烟测试（会新增并删除一笔 0.01 元账单）"
depends = ["build"]
run = "set -a && . ./.env.local && set +a && ./bin/ledger-snap qianji-smoke"

[tasks.eval]
description = "按 testdata/screens/labels.json 评测识别效果；参数放在 -- 之后，例如 --extraction-model qwen/qwen3.8-27b"
depends = ["build"]
run = "set -a && . ./.env.local && set +a && harmonia exec -- ./bin/ledger-snap eval"

[tasks.shortcut]
description = "生成并签名快捷指令到 dist/截图记账.shortcut（需要 macOS）；参数放在 -- 之后，例如 --server https://snap.example.com"
depends = ["build"]
run = "./bin/ledger-snap shortcut"

[tasks."release:shortcut"]
description = "签名快捷指令并上传到某个版本的 GitHub Release，没有 Release 时先创建（需要 macOS 和 gh）"
depends = ["build"]
usage = 'arg "<tag>" help="版本标签，例如 v0.1.0"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag="${usage_tag?}"
# 快捷指令只由这两处代码生成；它们在标签之后改过，就不能代表这个版本
if ! git diff --quiet "$tag" HEAD -- internal/shortcut cmd/ledger-snap/shortcutcmd.go; then
  echo "快捷指令的代码在 $tag 之后改过，请先切到 $tag 再上传" >&2
  exit 1
fi
if ! gh release view "$tag" >/dev/null 2>&1; then
  gh release create "$tag" --verify-tag --title "$tag" --notes "镜像：\`ghcr.io/cr-zhichen/ledger-snap:${tag#v}\`

快捷指令：在 iPhone 上下载附件 \`ledger-snap.shortcut\`，打开后按提示添加，之后可以在快捷指令 App 里改名为“截图记账”。"
fi
# GitHub 会把非 ASCII 的附件名改成 default，所以附件用英文名，中文只放在显示标签里
./bin/ledger-snap shortcut --out dist/ledger-snap.shortcut
gh release upload "$tag" "dist/ledger-snap.shortcut#截图记账（iPhone 快捷指令）" --clobber
'''

[tasks."docker:up"]
description = "用本地源码构建镜像，并按 .env 启动 Docker 服务"
run = "docker compose -f compose.yaml -f compose.build.yaml up -d --build"
