# 服务器上只需要这个文件和 .env：复制 .env.example 为 .env 并填写，然后 docker compose up -d
# 容器只提供 HTTP；HTTPS 由外部的反向代理负责。
# 用本地源码构建时叠加 compose.build.yaml：mise run docker:up

services:
  ledger-snap:
    # 默认用 GitHub 发布的最新镜像；在 .env 里设置 LEDGER_SNAP_IMAGE 可以固定版本
    image: ${LEDGER_SNAP_IMAGE:-ghcr.io/cr-zhichen/ledger-snap:latest}
    restart: unless-stopped
    # 密钥、邀请码都从 .env 读取。容器启动时会把 ./data 交给 .env 里的
    # LEDGER_SNAP_UID:LEDGER_SNAP_GID，再以这个用户运行，不用事先建目录或改属主
    env_file:
      - path: .env
        required: true
    volumes:
      # 数据库和截图都在 ./data 里，备份时直接复制这个目录
      - ./data:/app/data
      # 镜像自带同版本的 config.toml，单项配置用 .env 里的 LEDGER_SNAP_ 变量覆盖即可。
      # 要整体换掉时，下载同一版本的 config.toml 放在旁边，取消下一行的注释
      # - ./config.toml:/app/config.toml:ro
    ports:
      - "${LEDGER_SNAP_PORT:-8080}:8080"
